{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
  <h1>Forgot Password</h1>
  <p class="subtitle">Enter the email on your admin account and we'll send a link to reset your password.</p>

  <form method="post">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>

    <button type="submit" class="btn btn-primary" style="margin-top:1.5rem;">Send Reset Link</button>
  </form>

  <p class="hint" style="text-align:center; margin-top:1rem;">
    <a href="{{ url_for('admin.login') }}">Back to login</a>
  </p>
{% endblock %}
